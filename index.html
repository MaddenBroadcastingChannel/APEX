<style>


  html, body {

    margin: 0;

    padding: 0;

    width: 1920px;

    height: 1080px;

    background: transparent;

    overflow: hidden;

    font-family: Arial, Helvetica, sans-serif;

    user-select: none;

  }



  /* Controller is overlaid on top of the scorebug's top 720px, within the
     same 1920x1080 canvas (the scorebug itself is unchanged/untouched).
     In vMix, apply Crop: Top = 720px on this input so only the scorebug's
     visible graphic goes out on air; the full page — including this
     region — is still reachable by clicking into the input to interact
     with the controller.
     NOTE: verify the top ~720px of your scorebug graphic is visually
     blank/transparent there already (typical for a lower-third bug) —
     since the controller sits in the same rows rather than in extra
     canvas space, anything the scorebug draws in that area will be
     hidden behind the controller's opaque panel while editing, and will
     be cropped away from the live output along with the controller. */
  #controllerRegion {

    position: absolute;

    top: 0;

    left: 0;

    width: 1920px;

    height: 720px;

    background-color: #a5a5a5;

    display: flex;

    justify-content: center;

    align-items: center;

    overflow: hidden;

    z-index: 10000;

  }

  

  .blurred {

    filter: blur(8px);

    pointer-events: none;

  }



  .canvas-lock {

    width: 1120px;

    height: 720px; 

    display: flex;

    justify-content: center;

    align-items: center;

    transform-origin: center center;

    flex-shrink: 0;

    transition: filter 0.3s ease;

  }

  

  .panel-container { 

    background: #000000;

    border: 2px solid #a5a5a5;

    border-radius: 8px;

    padding: 24px;

    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);

    display: grid; 

    grid-template-columns: repeat(12, 1fr); 

    grid-gap: 14px; 

    width: 100%;

    height: 100%;

    box-sizing: border-box;

  }



  .section-label { 

    grid-column: span 4; 

    text-align: center; 

    font-weight: bold; 

    font-size: 14px; 

    color: #a5a5a5; 

    letter-spacing: 2px;

    align-self: end; 

    text-transform: uppercase;

  }

  

  .score-display { 

    grid-column: span 4; 

    width: 75px;

    font-size: 72px; 

    font-weight: bold; 

    text-align: center; 

    color: #000000; 

    line-height: 1.1;

    padding: 8px 0;

    background: #a5a5a5;

    border: 1px solid #a5a5a5;

    border-radius: 4px;

  }



  .btn { 

    background: #000000;

    color: #a5a5a5; 

    border: 2px solid #a5a5a5; 

    border-radius: 4px; 

    padding: 10px 6px; 

    font-size: 13px; 

    font-weight: bold; 

    cursor: pointer; 

    text-align: center; 

    text-transform: uppercase;

    letter-spacing: 1px;

    transition: background 0.1s ease, color 0.1s ease;

  }

  

  .btn:hover { 

    background: #a5a5a5;

    color: #000000;

  }

  

  .btn:active { 

    background: #555555; 

    color: #000000;

  }

  

  .btn.active-toggle { 

    background: #a5a5a5 !important; 

    color: #000000 !important;

  }



  .btn-action-start { background: #a5a5a5; color: #000000; border-color: #a5a5a5; }

  .btn-action-start:hover { background: #ffffff; border-color: #ffffff; }

  

  .btn-action-stop { background: #000000; color: #a5a5a5; border-color: #a5a5a5; }

  .btn-action-stop:hover { background: #555555; color: #ffffff; }

  

  .btn-reset {

    letter-spacing: 1px;

  }

  .circle-toggle {

    border-radius: 50%;

    cursor: pointer;

    background-color: #000000;

    transition: all 0.15s ease;

    align-self: center;

    box-sizing: border-box;

  }

  .circle-toggle::after {

    content: '';

  }

  .circle-toggle:hover {

    background: #000000;

  }

<script>

  const bugWrapper = document.getElementById('bugWrapper');
  const videoElements = document.querySelectorAll('video:not(#bug-video):not(#mask-video):not(#td-video-source)');
  
  const video = document.getElementById('bug-video');
  const maskVideo = document.getElementById('mask-video');
  const tdVideoSource = document.getElementById('td-video-source');
  const homeCanvas = document.getElementById('home-canvas');
  const homeCtx = homeCanvas.getContext('2d');
  const awayCanvas = document.getElementById('away-canvas');
  const awayCtx = awayCanvas.getContext('2d');
  const tdCanvas = document.getElementById('td-canvas');
  const tdCtx = tdCanvas.getContext('2d');
  const scratchCanvas = document.getElementById('scratch-canvas');
  const scratchCtx = scratchCanvas.getContext('2d');
  const logoCanvas = document.getElementById('logo-canvas');
  const logoCtx = logoCanvas.getContext('2d');

  const width = 1940;
  const height = 1100;
  homeCanvas.width = width; homeCanvas.height = height;
  awayCanvas.width = width; awayCanvas.height = height;
  tdCanvas.width = width;   tdCanvas.height = height;
  scratchCanvas.width = width; scratchCanvas.height = height;
  logoCanvas.width = width; logoCanvas.height = height;

  let homeColor = "#4f2683"; 
  let awayColor = "#002244"; 
  const homeLogoImg = new Image(); homeLogoImg.src = 'patriots.PNG';
  const awayLogoImg = new Image(); awayLogoImg.src = 'patriots.PNG';

  let lastAction = "";
  let introSequenceActive = false;
  let tdAnimationActive = false;
  let tdStartTime = null;
  let scoringSide = "away";

  let currentAwayDdState = null;
  let currentHomeDdState = null;

  function renderLoop(timestamp) {
      if (tdAnimationActive) {
          if (!tdStartTime) tdStartTime = timestamp;
          const elapsed = (timestamp - tdStartTime) / 1000;

          if (tdVideoSource.ended) {
              tdCtx.clearRect(0, 0, width, height);
              logoCtx.clearRect(0, 0, width, height);
              homeCtx.clearRect(0, 0, width, height);
              awayCtx.clearRect(0, 0, width, height);
              tdAnimationActive = false;
              tdStartTime = null;
          } else {
              homeCtx.clearRect(0, 0, width, height);
              awayCtx.clearRect(0, 0, width, height);
              tdCtx.clearRect(0, 0, width, height);
              scratchCtx.clearRect(0, 0, width, height);
              logoCtx.clearRect(0, 0, width, height);

              if (maskVideo.readyState >= 2) {
                  if (video.readyState >= 2 && !video.ended) {
                      scratchCtx.drawImage(video, 0, 0, width, height);
                      scratchCtx.globalCompositeOperation = 'source-in';
                      scratchCtx.fillStyle = (scoringSide === "home") ? homeColor : awayColor;
                      scratchCtx.fillRect(0, 0, width, height);
                      scratchCtx.globalCompositeOperation = 'source-over';

                      if (scoringSide === "home") {
                          homeCtx.drawImage(scratchCanvas, 0, 0, width, height);
                          homeCtx.globalCompositeOperation = 'destination-in';
                          homeCtx.drawImage(maskVideo, 0, 0, width, height);
                          homeCtx.globalCompositeOperation = 'source-over';
                      } else {
                          awayCtx.drawImage(scratchCanvas, 0, 0, width, height);
                          awayCtx.globalCompositeOperation = 'destination-in';
                          awayCtx.drawImage(maskVideo, 0, 0, width, height);
                          awayCtx.globalCompositeOperation = 'source-over';
                      }
                      scratchCtx.clearRect(0, 0, width, height);
                  }

                  if (tdVideoSource.readyState >= 2 && !tdVideoSource.ended) {
                      tdCtx.drawImage(tdVideoSource, 0, 0, width, height);
                      tdCtx.globalCompositeOperation = 'destination-in';
                      tdCtx.drawImage(maskVideo, 0, 0, width, height);
                      tdCtx.globalCompositeOperation = 'source-over';
                  }

                  const runningLogo = (scoringSide === "home") ? homeLogoImg : awayLogoImg;
                  if (runningLogo.complete && runningLogo.naturalWidth !== 0) {
                      const delay = 0.733; 
                      const moveDuration = 3.266;
                      const fadeDuration = 0.500;

                      let currentLeft = 1500;
                      let currentOpacity = 0;

                      if (elapsed >= delay) {
                          const moveProgress = Math.min((elapsed - delay) / moveDuration, 1);
                          currentLeft = 1500 + (moveProgress * (1600 - 1500));
                          const fadeProgress = Math.min((elapsed - delay) / fadeDuration, 1);
                          currentOpacity = fadeProgress;
                      }

                      const maxBoundSize = 175; 
                      let targetWidth = runningLogo.naturalWidth;
                      let targetHeight = runningLogo.naturalHeight;
                      const aspect = targetWidth / targetHeight;

                      if (targetWidth > targetHeight) {
                          if (targetWidth > maxBoundSize) {
                              targetWidth = maxBoundSize;
                              targetHeight = maxBoundSize / aspect;
                          }
                      } else {
                          if (targetHeight > maxBoundSize) {
                              targetHeight = maxBoundSize;
                              targetWidth = maxBoundSize * aspect;
                          }
                      }

                      const centerYOffset = 890 + ((200 - targetHeight) / 2);
                      const centerXOffset = currentLeft + ((200 - targetWidth) / 2);

                      logoCtx.save();
                      logoCtx.globalAlpha = currentOpacity;
                      logoCtx.drawImage(runningLogo, centerXOffset, centerYOffset, targetWidth, targetHeight);
                      logoCtx.restore();

                      logoCtx.globalCompositeOperation = 'destination-in';
                      logoCtx.drawImage(maskVideo, 0, 0, width, height);
                      logoCtx.globalCompositeOperation = 'source-over';
                  }
              }
          }
      }
      requestAnimationFrame(renderLoop);
  }
  requestAnimationFrame(renderLoop);

  // Called directly by the controller's syncState() now that both live on
  // the same page — no BroadcastChannel/network hop needed, so updates are
  // instant.
  function applyState(state) {
    if (!state) return;

    if(state.away_color !== undefined) {
      awayColor = state.away_color;
      const aColorImg = document.getElementById('awaycolor.png');
      if (aColorImg) aColorImg.style.filter = `drop-shadow(1920px 0 0 ${awayColor})`;
    }
    if(state.home_color !== undefined) {
      homeColor = state.home_color;
      const hColorImg = document.getElementById('homecolor.png');
      if (hColorImg) hColorImg.style.filter = `drop-shadow(1920px 0 0 ${homeColor})`;
    }

    if(state.away_logo_url !== undefined && awayLogoImg.src !== state.away_logo_url) awayLogoImg.src = state.away_logo_url;
    if(state.home_logo_url !== undefined && homeLogoImg.src !== state.home_logo_url) homeLogoImg.src = state.home_logo_url;
    if(state.away_abr !== undefined) document.getElementById('ui-awayabr').innerText = state.away_abr;
    if(state.home_abr !== undefined) document.getElementById('ui-homeabr').innerText = state.home_abr;

    if(state.away_score !== undefined) document.getElementById('ui-awayscore').innerText = state.away_score;
    if(state.home_score !== undefined) document.getElementById('ui-homescore').innerText = state.home_score;
    if(state.game_clock !== undefined) document.getElementById('ui-gameclock').innerText = state.game_clock;
    if(state.quarter !== undefined) document.getElementById('ui-qtr').innerText = state.quarter;

    if(state.down !== undefined && state.distance !== undefined) {
        let formattedString = "";
        if (state.distance === "DOWN") {
            formattedString = state.down; 
        } else {
            let cleanDown = state.down.split(" ")[0]; 
            formattedString = `${cleanDown} & ${state.distance}`;
        }
        document.getElementById('ui-away-dd-text').innerText = formattedString;
        document.getElementById('ui-home-dd-text').innerText = formattedString;
    }
    if(state.play_clock !== undefined) {
        document.getElementById('ui-away-playclock').innerText = `:${state.play_clock}`;
        document.getElementById('ui-home-playclock').innerText = `:${state.play_clock}`;
    }

    if(state.away_dd_active !== undefined && state.away_dd_active !== currentAwayDdState) {
        currentAwayDdState = state.away_dd_active;
        const el = document.getElementById('away-dnd');
        el.className = "dnd-container " + (currentAwayDdState ? "away-dd-in" : "away-dd-out");
    }

    if(state.home_dd_active !== undefined && state.home_dd_active !== currentHomeDdState) {
        currentHomeDdState = state.home_dd_active;
        const el = document.getElementById('home-dnd');
        el.className = "dnd-container " + (currentHomeDdState ? "home-dd-in" : "home-dd-out");
    }

    if (state.trigger_td_side !== undefined && state.trigger_td_side !== "") {
        scoringSide = state.trigger_td_side;
        tdAnimationActive = true;
        tdStartTime = null;
        
        video.currentTime = 0;
        maskVideo.currentTime = 0;
        tdVideoSource.currentTime = 0;
        
        video.play().catch(e => {});
        maskVideo.play().catch(e => {});
        tdVideoSource.play().catch(e => {});
    }

    if (state.timeouts && state.action === 'IN' && !introSequenceActive) {
      ['away', 'home'].forEach(team => {
        for (let i = 1; i <= 3; i++) {
          const el = document.getElementById(`ui-${team}-to${i}`);
          if(el) {
            el.style.opacity = state.timeouts[team][i-1] ? "1" : "0.5";
          }
        }
      });
    }

    if (state.action !== lastAction) {
      if (state.action === 'IN') {
        introSequenceActive = true;
        bugWrapper.classList.remove('animate-in');
        
        currentAwayDdState = false;
        currentHomeDdState = false;
        const awayDnD = document.getElementById('away-dnd');
        const homeDnD = document.getElementById('home-dnd');
        awayDnD.className = "dnd-container";
        homeDnD.className = "dnd-container";
        awayDnD.style.opacity = "0";
        homeDnD.style.opacity = "0";
        awayDnD.style.transform = "translate(0px, 100px)";
        homeDnD.style.transform = "translate(998px, 100px)";
        
        videoElements.forEach(v => {
          v.currentTime = 0;
          v.play().catch(e => console.log("Playback prevented:", e));
        });

        document.getElementById('ui-awayabr').className = "awayabr";
        document.getElementById('ui-homeabr').className = "homeabr";
        document.getElementById('ui-awayscore').className = "awayscore";
        document.getElementById('ui-homescore').className = "homescore";
        
        const hColorImg = document.getElementById('homecolor.png');
        const aColorImg = document.getElementById('awaycolor.png');
        if(hColorImg) hColorImg.className = "color-img-mask";
        if(aColorImg) aColorImg.className = "color2-img-mask";

        document.getElementById('ui-gameclock').className = "gameclock";
        document.getElementById('ui-qtr').className = "qtr";

        ['away', 'home'].forEach(team => {
          for (let i = 1; i <= 3; i++) {
            const el = document.getElementById(`ui-${team}-to${i}`);
            if(el) el.style.opacity = "0";
          }
        });
        
        void bugWrapper.offsetWidth; 
        
        bugWrapper.classList.add('animate-in');
        document.getElementById('ui-awayabr').classList.add('awayabrin');
        document.getElementById('ui-homeabr').classList.add('homeabrin');
        document.getElementById('ui-awayscore').classList.add('awayscoreinmove', 'awayscoreinfade');
        document.getElementById('ui-homescore').classList.add('homescoreinmove', 'homescoreinfade');
        
        if(hColorImg) hColorImg.classList.add('homecolorin');
        if(aColorImg) aColorImg.classList.add('awaycolorin');

        setTimeout(() => { if(bugWrapper.classList.contains('animate-in')) document.getElementById('ui-away-to1').style.opacity = state.timeouts.away[0] ? "1" : "0.5"; }, 1040);
        setTimeout(() => { if(bugWrapper.classList.contains('animate-in')) document.getElementById('ui-away-to2').style.opacity = state.timeouts.away[1] ? "1" : "0.5"; }, 1140);
        setTimeout(() => { if(bugWrapper.classList.contains('animate-in')) document.getElementById('ui-away-to3').style.opacity = state.timeouts.away[2] ? "1" : "0.5"; }, 1240);
        
        setTimeout(() => { if(bugWrapper.classList.contains('animate-in')) document.getElementById('ui-home-to1').style.opacity = state.timeouts.home[0] ? "1" : "0.5"; }, 1040);
        setTimeout(() => { if(bugWrapper.classList.contains('animate-in')) document.getElementById('ui-home-to2').style.opacity = state.timeouts.home[1] ? "1" : "0.5"; }, 1140);
        setTimeout(() => { if(bugWrapper.classList.contains('animate-in')) document.getElementById('ui-home-to3').style.opacity = state.timeouts.home[2] ? "1" : "0.5"; }, 1240);

        setTimeout(() => { introSequenceActive = false; }, 1500);

      } else if (state.action === 'OUT') {

<script>


 // --- CRITICAL CONFIGURATION ---

  // Explicit initialization handler for OBS

        if (value.length > 4) formatted += '-' + value.substring(4, 8);

    window.addEventListener('keydown', (e) => {

  }



  function showOverlay() {

    activationOverlay.style.display = 'flex';

    masterCanvas.classList.add('blurred');

  }



  function bypassOverlay() {

    activationOverlay.style.display = 'none';

    masterCanvas.classList.remove('blurred');

  // LIVE DATABASE VERIFICATION + DEVICE BINDING

  async function checkActivationKey() {

    const inputEl = document.getElementById('activationKeyInput');

    const enteredKey = inputEl.value;



    if (!enteredKey) return;



    const cleanKey = enteredKey.trim().toUpperCase();

    activationError.style.display = 'none';

    const myDeviceId = getDeviceId();



    try {

      const response = await fetch(`${SUPABASE_URL}/rest/v1/activation_keys?key_code=eq.${cleanKey}&select=*`, {

        method: "GET",

        headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${SUPABASE_ANON_KEY}` }

      });

      const data = await response.json();



      if (!data || data.length === 0) {

        activationError.innerText = "❌ KEY NOT FOUND IN DATABASE.";

        activationError.style.display = 'block';

        showOverlay();

        return;

      }



      const keyRow = data[0];



      if (keyRow.is_reusable === true) {

        // Tester/reusable key — works on any device, never gets claimed.

        localStorage.setItem(LICENSE_STORAGE_FLAG, 'true');

        bypassOverlay();

        return;

      }



      if (keyRow.device_id && keyRow.device_id !== myDeviceId) {

        // Already claimed by a different device — block reuse/sharing.

        activationError.innerText = "❌ KEY ALREADY IN USE ON ANOTHER DEVICE.";

        activationError.style.display = 'block';

        showOverlay();

        return;

      }



      if (!keyRow.device_id) {

        // First use of this key anywhere — claim it for this device.

        // The RLS policy only allows this write when device_id is currently

        // null, so a race between two devices can only let one succeed.

        const claimResponse = await fetch(`${SUPABASE_URL}/rest/v1/activation_keys?key_code=eq.${cleanKey}&device_id=is.null`, {

          method: "PATCH",

          headers: {

            "apikey": SUPABASE_ANON_KEY,

            "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,

            "Content-Type": "application/json",

            "Prefer": "return=representation"

          },

          body: JSON.stringify({ device_id: myDeviceId })

        });

        const claimData = await claimResponse.json();



        if (!claimResponse.ok || !claimData || claimData.length === 0) {

          // Someone else claimed it a moment before us.

          activationError.innerText = "❌ KEY ALREADY IN USE ON ANOTHER DEVICE.";

          activationError.style.display = 'block';

          showOverlay();

          return;

        }

      }



      // Success: remember this dock so it doesn't prompt again on this dock,

      // even if the tab/dock is closed and reopened (but not delete+re-add).

      localStorage.setItem(LICENSE_STORAGE_FLAG, 'true');

      bypassOverlay();

    } catch (error) {

      activationError.innerText = "🚨 CONNECTION ERROR.";

      activationError.style.display = 'block';

    }

  }



  function applyDynamicScaling() {

    const targetWidth = 1120;

    const targetHeight = 720;

    const region = document.getElementById('controllerRegion');

    const windowWidth = region.clientWidth;

    const windowHeight = region.clientHeight;

    const scaleFactor = Math.min(windowWidth / targetWidth, windowHeight / targetHeight);

    masterCanvas.style.transform = `scale(${scaleFactor})`;

  }



  window.addEventListener('resize', applyDynamicScaling);



  function handleManualDistanceFocus() {

    let inputEl = document.getElementById('distance-input');

    inputEl.value = "";

  }



  function handleManualDistanceBlur() {

    let inputEl = document.getElementById('distance-input');

    let raw = inputEl.value.trim().toUpperCase();

    let match = raw.match(/(\d+|GOAL|G|INCHES)/);



    if (!match || raw === "") {

      inputEl.value = `${currentSelectedDown} DOWN`;

      state.distance = "DOWN";

      state.down = `${currentSelectedDown} DOWN`;

    } else {

      let val = match[1];

      if (val === "GOAL" || val === "G") {

        inputEl.value = `${currentSelectedDown} & GOAL`;

        state.distance = "GOAL";

        state.down = currentSelectedDown;

      } else if (val === "INCHES") {

        inputEl.value = `${currentSelectedDown} & INCHES`;

        state.distance = "INCHES";

        state.down = currentSelectedDown;

      } else {

        inputEl.value = `${currentSelectedDown} & ${val}`;

        state.distance = val;

        state.down = currentSelectedDown;

      }

    }

    syncState();

  }



  function setQuickDistance(type) {

  });

  function hslToHex(h, s, l) {
    s /= 100; l /= 100;
    const k = n => (n + h / 30) % 12;
    const a = s * Math.min(l, 1 - l);
    const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
    const toHex = x => Math.round(255 * x).toString(16).padStart(2, '0');
    return `#${toHex(f(0))}${toHex(f(8))}${toHex(f(4))}`.toUpperCase();
  }

  function hexToHue(hex) {
    hex = hex.replace('#', '');
    if (hex.length !== 6) return 0;
    const r = parseInt(hex.substr(0, 2), 16) / 255;
    const g = parseInt(hex.substr(2, 2), 16) / 255;
    const b = parseInt(hex.substr(4, 2), 16) / 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b);
    let h = 0;
    const d = max - min;
    if (d !== 0) {
      switch (max) {
        case r: h = ((g - b) / d) % 6; break;
        case g: h = (b - r) / d + 2; break;
        case b: h = (r - g) / d + 4; break;
      }
      h *= 60;
      if (h < 0) h += 360;
    }
    return Math.round(h);
  }

  function startGameClock() {

  }

  

  function stopGameClock() { clearInterval(gameClockInterval); gameClockInterval = null; }



  function updateGameClockDisplay() {

    let mins = Math.floor(gameTime / 60);

  function handleManualClockInput(val) {

    } else if (parts.length === 1) {

      gameTime = parseInt(parts[0], 10) || 0;

    }

    updateGameClockDisplay();

  }



  function startPlayClock() {

    if (playClockInterval) return;

    playClockInterval = setInterval(() => {

      if (playTime > 0) { playTime--; updatePlayClockDisplay(); } else { playTime = 40; updatePlayClockDisplay(); }

    }, 1000);

  }

  

  function stopPlayClock() { clearInterval(playClockInterval); playClockInterval = null; }

      state.away_dd_active = false;

      state.home_dd_active = false;

      document.getElementById('away-dd-circle').classList.remove('toggled');

      document.getElementById('home-dd-circle').classList.remove('toggled');

    }

    syncState(); 

  }



  function resetAll() {

    stopGameClock(); stopPlayClock();

    gameTime = 15 * 60; playTime = 40;

    state.away_score = 0; state.home_score = 0; state.quarter = "1st"; state.action = "IN";

    document.getElementById('home-score-val').innerText = 0;

    ['away','home'].forEach(team => {

        document.getElementById(`${team === 'away' ? 'a' : 'h'}to${i}`).classList.add('active-toggle');

      }

    });

    syncState();

  }



  setInterval(syncState, 1000);
